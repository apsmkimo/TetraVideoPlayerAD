name: Android CI

on:
  push:
  # Also build PRs so FFmpeg JNI packaging is verified before merge.
  pull_request:
    branches: [main]
  # SMCPKG_SUPPORT>>>Cursor034
  workflow_dispatch:
  # SMCPKG_SUPPORT<<<Cursor034

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for Gradlew
        run: chmod +x ./gradlew

      # SMCPKG_SUPPORT>>>Cursor030
      # NDK is not required: :decoder-ffmpeg ships prebuilt libffmpegJNI.so
      # plus LGPL-only shared FFmpeg .so (no --enable-gpl / --enable-nonfree).
      # Rebuild natives locally with ./decoder-ffmpeg/rebuild-native.sh (NDK r26b + FFmpeg 6.0).
      # SMCPKG_SUPPORT<<<Cursor030
      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  # SMCPKG_SUPPORT>>>Cursor034
  # Signed Play Console AAB. Restricted to main / workflow_dispatch so PRs and
  # forks do not fail when ANDROID_* secrets are absent. If any secret is
  # missing the job still succeeds and skips the Gradle release steps.
  build-release:
    name: Release AAB
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ] && \
             [ -n "${ANDROID_KEYSTORE_PASSWORD}" ] && \
             [ -n "${ANDROID_KEY_ALIAS}" ] && \
             [ -n "${ANDROID_KEY_PASSWORD}" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not set; skipping signed AAB."
          fi

      - name: Set up JDK 17
        if: steps.signing.outputs.has_secrets == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for Gradlew
        if: steps.signing.outputs.has_secrets == 'true'
        run: chmod +x ./gradlew

      - name: Decode upload keystore
        if: steps.signing.outputs.has_secrets == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/upload-keystore.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"
          if [ ! -s "${KEYSTORE_PATH}" ]; then
            echo "Decoded keystore is empty."
            exit 1
          fi
          echo "KEYSTORE_FILE=${KEYSTORE_PATH}" >> "$GITHUB_ENV"

      - name: Build signed release AAB
        if: steps.signing.outputs.has_secrets == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload release AAB
        if: steps.signing.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/bundle/release/app-release.aab
  # SMCPKG_SUPPORT<<<Cursor034
