name: Android CI

on:
  push:
  # Also build PRs so FFmpeg JNI packaging is verified before merge.
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for Gradlew
        run: chmod +x ./gradlew

      # SMCPKG_SUPPORT>>>Cursor030
      # NDK is not required: :decoder-ffmpeg ships prebuilt libffmpegJNI.so
      # plus LGPL-only shared FFmpeg .so (no --enable-gpl / --enable-nonfree).
      # Rebuild natives locally with ./decoder-ffmpeg/rebuild-native.sh (NDK r26b + FFmpeg 6.0).
      # SMCPKG_SUPPORT<<<Cursor030
      # SMCPKG_SUPPORT>>>Cursor031
      # CI builds debug only. Debug always uses committed Google test AdMob IDs.
      # Release signing and production AdMob IDs are local-only (local.properties
      # or env). Do not echo ADMOB_* values if a future job adds assembleRelease.
      # SMCPKG_SUPPORT<<<Cursor031
      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
